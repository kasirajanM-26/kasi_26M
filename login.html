<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Brain Tumor Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body class="auth-body">
    <div class="auth-shell">
      <div class="card glass">
        <div class="card-header">
          <div class="brand">
            <div class="brand-title">Brain Tumor AI</div>
            <div class="brand-subtitle">Detection & Segmentation</div>
          </div>
        </div>

        <h2 class="title">Sign in</h2>
        <p class="muted">Use your credentials to continue.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="alerts">
              {% for category, message in messages %}
                <div class="alert {{ category }}">{{ message }}</div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="post" class="form">
          <label class="label">Email</label>
          <input class="input" type="email" name="email" placeholder="Enter email" required autocomplete="email" autocapitalize="none" spellcheck="false" />

          <label class="label">Password</label>
          <input class="input" type="password" name="password" placeholder="Enter password" required autocomplete="current-password" />

          <button class="btn primary btn-lg" type="submit">Login</button>
        </form>

        <div class="card-footer">
          <div class="row-between">
            <a class="link" href="{{ url_for('register') }}">Create an account</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
